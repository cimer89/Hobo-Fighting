<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hobo Fighting – makieta planowania</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9d6cf;--panel:#eeebe4;--ink:#1c1d1f;--mute:#666a6e;--line:#8d8a83;--hex:#e4e0d6;--ok:#2e8b57;--hit:#c9302c;--acc:#f2c230;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c1e;--panel:#26292c;--ink:#ecebe6;--mute:#9a9ea3;--line:#4a4e52;--hex:#2f3336;--ok:#4fc183;--hit:#ff6a5f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1c1e;--panel:#26292c;--ink:#ecebe6;--mute:#9a9ea3;--line:#4a4e52;--hex:#2f3336;--ok:#4fc183;--hit:#ff6a5f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font:400 24px/1 Bangers,Impact,sans-serif;letter-spacing:1px;margin:2px 0 0;flex:none}
p{margin:2px 0;color:var(--mute);font-size:14px;flex:none}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:0;flex:none}
button{font:inherit;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:9px 12px;border-radius:6px;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:#1c1d1f;font-weight:700}
button.go{background:var(--ink);color:var(--bg);width:100%;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.chip{border-left-width:10px}
.card{background:var(--panel);border:2px solid var(--ink);border-radius:6px;padding:6px 10px;margin:0;flex:none}
.hp{display:flex;gap:5px;align-items:center}
.hp i{width:22px;height:22px;border:2px solid var(--ink);background:var(--hit);border-radius:3px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
@keyframes stIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
button{flex:none}
button.go{flex:none}
.hexp{fill:transparent;stroke:rgba(255,255,255,.6);stroke-width:2.5}
svg.bd{border:2px solid var(--ink);border-radius:6px}
.tok{font:700 13px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.lbl{font:700 11px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:2.5px}
.sum li{margin:1px 0}
.sum{font-size:12px;line-height:1.3}
.sum .av{width:26px;height:26px}
.sum p{font-size:12px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--ink);vertical-align:middle;flex:none}
button.face{flex:1;min-width:56px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;border-color:var(--c);font-size:12px}
button.face img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px}
button.face.on{background:var(--c);color:#fff;font-weight:700}
.fl{font:700 56px system-ui,sans-serif;fill:#ff5a4f;stroke:#000;stroke-width:9px;paint-order:stroke;text-anchor:middle;animation:flt 1s ease-out forwards}
.fl.miss{fill:#d9d9d9}
.lbl2{font:700 30px system-ui,sans-serif;fill:#fff;stroke:#000;stroke-width:7px;paint-order:stroke;text-anchor:middle}
.flash{fill-opacity:.55;stroke:#fff;stroke-width:4;animation:flsh .6s ease-in-out 3}
@keyframes flsh{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes flt{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
.shk{animation:shk .45s linear}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);display:none;background:var(--acc);color:#1c1d1f;border:3px solid #1c1d1f;border-radius:8px;padding:10px 18px;text-align:center;z-index:9;font:400 40px Bangers,Impact,sans-serif;box-shadow:0 6px 0 #1c1d1f;max-width:90vw}
.pop small{font:600 15px system-ui,sans-serif;display:block;margin-top:4px}
.pop.show{display:block;animation:popin .9s ease-out}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.08);opacity:1}100%{transform:translate(-50%,-50%) scale(1)}}
.spl{flex:1 1 0;min-height:0;position:relative;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#000;touch-action:manipulation}
.spl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.press{position:absolute;left:0;right:0;top:58.5%;text-align:center;font:400 26px Bangers,Impact,sans-serif;letter-spacing:2px;color:#15161a;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 3px rgba(255,255,255,.9);animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.pp{flex:none;display:flex;flex-direction:column;gap:5px}
.pp.pin{animation:inR .45s cubic-bezier(.2,.8,.2,1)}
.pp.pout{animation:outL .38s ease-in forwards}
@keyframes inR{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes outL{from{transform:none;opacity:1}to{transform:translateX(-110%);opacity:0}}
#stage{position:fixed;top:0;left:0;right:0;height:50vh;height:50dvh;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .5s}
#stage svg{height:100%;width:auto;max-width:100%;display:block;pointer-events:auto}
#stage.hide{display:none}
#stage.dim{opacity:.85}
#stage.front{opacity:1}
#stage.enter{animation:stIn .7s ease-out}
main{position:fixed;top:50vh;top:50dvh;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;z-index:1;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));overflow:hidden}
main.full{top:0;justify-content:flex-start}
main>*{pointer-events:auto}
main:not(.full){gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)) 8px}
main:not(.full) p{margin:0;font-size:12px;line-height:1.25}
main:not(.full) h2{font-size:20px!important;margin:0!important}
main:not(.full) .card{padding:5px 8px;font-size:13px}
main:not(.full) .card p{font-size:12px}
main:not(.full) .av{width:34px;height:34px}
main:not(.full) .row{gap:4px}
main:not(.full) .pp{gap:4px}
main:not(.full) button{min-height:38px;padding:6px 10px}
main:not(.full) button.go{padding:8px}
main:not(.full) button.face{min-width:0;padding:2px}
main:not(.full) button.face img{width:50px;height:50px;aspect-ratio:auto;margin:0 auto}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>

async function runAnim(){

   if(st.skipReq)break;
   ovSet('');
   if(e.k==='phase'){capSet(e.ph===0?'Faza I: ruchy i ścisk, potem ataki':'Faza II: ruchy i ścisk, potem ataki');await wait(500)}
   else if(e.k==='move'){
    capSet(nmOf(e.id)+' rusza się');const a=GEO[e.from.join(',')].c,b=GEO[e.to.join(',')].c;
    await tween(480,t=>tokMove(e.id,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t));st.logPos[e.id]=e.to.slice();await wait(120)}
   else if(e.k==='atk'){
    const cells=e.cells||[];let h='';
    cells.forEach(c=>{const p=GEO[c[0]+','+c[1]].c;h+='<g transform="translate('+p[0]+','+p[1]+')"><polygon class="flash" points="'+GEO[c[0]+','+c[1]].p+'" fill="'+C[e.ch].col+'"/></g>'});
    if(!e.hit&&cells.length){const mc=e.ch==='Wiatrak'?cells[0]:cells[cells.length-1];const p=GEO[mc[0]+','+mc[1]].c;h+='<g transform="translate('+p[0]+','+(p[1]-30)+')"><text class="fl miss">PUDŁO</text></g>'}
    ovSet(h);capSet(nmOf(e.id)+' atakuje'+(e.hit?'':' — pudło'));await wait(e.hit?650:900)}
   else if(e.k==='dmg'){
    const p=st.curPos[e.id]||[0,0];shakeTok(e.id);
    ovSet('<g transform="translate('+p[0]+','+(p[1]-62)+')"><text class="fl">−'+e.n+'</text></g><g transform="translate('+p[0]+','+(p[1]+78)+')"><text class="lbl2">'+e.w+'</text></g>');
    capSet(nmOf(e.id)+' −'+e.n+' ('+e.w+')');await wait(620)}
   else if(e.k==='push'){
    popSet('DODATKOWA AKCJA!','Przesunięcie: '+nmOf(e.id)+' o 1 pole');await wait(1000);popHide();
    const a=GEO[e.from.join(',')].c,b=GEO[e.to.join(',')].c;capSet(nmOf(e.id)+' przesunięty');
    await tween(560,t=>tokMove(e.id,a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t));st.logPos[e.id]=e.to.slice();await wait(200)}
   else if(e.k==='out'){const p=st.curPos[e.id]||[0,0];ovSet('<g transform="translate('+p[0]+','+(p[1]-62)+')"><text class="fl">ODPADA</text></g>');capSet(nmOf(e.id)+' odpada z gry');await wait(800)}
  }
 }finally{
  ovSet('');popHide();st.animating=false;st.skipReq=false;render();
 }
}

function render(){
 BOARD_SVG=null;if(st.scr==='splash'){app.className='full';app.innerHTML=splashH();stageSet(false);return}
 const c=C[st.ch];
 let h=(st.scr==='lobby'?'<h1>HOBO FIGHTING</h1>':'')+(net.code?'<p>Pokój: <b>'+net.code+'</b></p>':'')+(st.scr==='plan'?'<p>Runda '+st.round+(zoneR(st.round)<3?'. Czerwone pola to strefa: −1 HP na koniec rundy.':'')+'</p>':'')+(H&&(st.scr==='pick'||st.scr==='plan')?'<p><b>Gracz '+(H.cur+1)+'</b></p>':'');
 if(st.scr==='hsetup'){h+=hSetupH()}else if(st.scr==='hpass'){h+=hPassH()}else if(st.scr==='hstarts'){h+=hStartsH()}else if(st.scr==='hrev'){h+=hRevH()}else if(st.scr==='lobby'){h+=lobbyH()}else if(st.scr==='wait'){h+=waitH()}else if(st.scr==='rev'){h+=revH()}else if(st.scr==='pick'){
  const pk='pick:'+st.round+':'+(H?H.cur:'o'),cls=st.lastPanel!==pk?' pin':'';st.lastPanel=pk;
  h+='<div id="phpanel" class="pp'+cls+'"><p>Tajny wybór pola startowego. Kilku graczy może wybrać to samo pole.</p><div class="row">'+Object.keys(C).map(n=>'<button class="face'+(n===st.ch?' on':'')+'" style="--c:'+C[n].col+'" data-ch="'+n+'" '+(taken(n)?'disabled':'')+'><img src="'+IMG[n]+'" alt=""><span>'+n+'</span></button>').join('')+'</div>';
  h+='<div class="card" style="display:flex;gap:10px;align-items:center;border-color:'+c.col+'"><img class="av" style="width:64px;height:64px;border-color:'+c.col+'" src="'+IMG[st.ch]+'" alt=""><div><b>'+st.ch+'</b><p>'+c.txt+'</p></div></div>';
  const hl={};if(st.start)hl[K(...st.start)]={fill:c.col,t:st.ch[0]};
  h+='<p style="text-align:center">'+(st.start?'Start: pole '+st.start.join(', '):'Dotknij pola, na którym chcesz zacząć.')+'</p><button class="go" data-a="confirm" '+(st.start?'':'disabled')+'>Zatwierdź start</button></div>';
  h+=board(hl);
 }else{
  const ph=st.ph,pl=st.plan[ph],from=fromPos(ph),hl={},ROM=['I','II'];
  const faint=(p,x,i)=>attack(p,x.d,i).forEach(([q,r,v])=>{hl[K(q,r)]={fill:'color-mix(in srgb,var(--hit) 22%,transparent)',stroke:'var(--hit)',t:v}});
  if(st.done){
   const lb={};const add=(p,t)=>{const k=K(...p);lb[k]=(lb[k]?lb[k]+'/':'')+t};
   add(st.start,'S');add(fromPos(1),'1');add(fromPos(2),'2');
   st.plan.forEach((x,i)=>{if(x.t==='atk'&&x.d!==null)faint(fromPos(i),x,i)});
   Object.keys(lb).forEach(k=>{hl[k]=Object.assign({},hl[k],{fill:c.col,t:lb[k]})});
  }else{
   if(ph===1&&st.plan[0].t==='atk'&&st.plan[0].d!==null)faint(from,st.plan[0],0);
   if(pl.t==='move'){
    D.forEach(([a,b])=>{const q=from[0]+a,r=from[1]+b;if(IN(q,r))hl[K(q,r)]={fill:'color-mix(in srgb,var(--ok) 35%,transparent)',stroke:'var(--ok)'}});
    if(pl.m)hl[K(...pl.m)]={fill:'color-mix(in srgb,var(--ok) 55%,transparent)',stroke:'var(--ink)',t:K(...pl.m)===K(...from)?'•':'→'};
   }else if(pl.t==='atk'){
    if(pl.d!==null)attack(from,pl.d,ph).forEach(([q,r,v])=>{hl[K(q,r)]={fill:'color-mix(in srgb,var(--hit) 40%,transparent)',stroke:'var(--hit)',t:v}});
    else D.forEach(([a,b])=>{const q=from[0]+a,r=from[1]+b;if(IN(q,r))hl[K(q,r)]={stroke:'var(--hit)'}});
   }
   if(!pl.m||K(...pl.m)!==K(...from))hl[K(...from)]=Object.assign({},hl[K(...from)],{fill:c.col,t:st.ch[0]});
  }
  othersOverlay(hl);
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span style="display:flex;gap:10px;align-items:center"><img class="av" style="border-color:'+c.col+'" src="'+IMG[st.ch]+'" alt=""><b style="font-size:18px">'+st.ch+'</b></span>'+pips({hp:myHp()},false)+'</div><p>'+c.txt+'</p></div>';
  if(!st.done){
   const pk=st.round+':'+ph+':'+(H?H.cur:'o')+':'+st.scr,cls=st.lastPanel!==pk?' pin':'';st.lastPanel=pk;
   h+='<div id="phpanel" class="pp'+cls+'"><h2 style="font:400 26px Bangers,Impact,sans-serif;margin:8px 0 0">Faza '+ROM[ph]+' z II</h2><div class="row"><button style="flex:1" class="'+(pl.t==='move'?'on':'')+'" data-t="move">Ruch</button><button style="flex:1" class="'+(pl.t==='atk'?'on':'')+'" data-t="atk" '+(st.ch==='Byku'?'disabled':'')+'>Atak</button></div>';
   const hint=!pl.t?'Wybierz, co robisz w tej fazie: ruch albo atak.':pl.t==='move'?(st.ch==='Byku'?'Ruch o 1 pole. Wejście na pole przeciwnika to szarża.':'Ruch o 1 pole lub zostań (dotknij własnego pola).'):(pl.d===null?'Dotknij sąsiedniego pola, by wybrać kierunek ataku.':'Atak: '+DN[pl.d]+'. Liczby to obrażenia.');
   const ok=pl.t==='move'?!!pl.m:pl.t==='atk'&&pl.d!==null;
   h+='<p style="text-align:center">'+hint+' Inni: pozycje z początku rundy.</p><button class="go" data-a="ok" '+(ok?'':'disabled')+'>'+(ph===0?'Zatwierdź fazę I':'Zatwierdź fazę II')+'</button>';
   if(ph===1)h+='<div class="row" style="justify-content:center"><button data-a="prev">← Wróć do fazy I</button></div>';
   else if(!net.db&&!H)h+='<div class="row" style="justify-content:center"><button data-a="back">← Wybór startu</button></div>';
   h+='</div>';
   h+=board(hl);
  }else{
   h+=board(hl);
   const line=i=>{const x=st.plan[i];return '<li><b>Faza '+ROM[i]+':</b> '+(x.t==='move'?(K(...x.m)===K(...fromPos(i))?'zostaje na polu':'ruch → '+x.m.join(', ')):'atak '+DN[x.d])+'</li>'};
    const sumTxt=[0,1].map(i=>{const x=st.plan[i];return 'Faza '+ROM[i]+': '+(x.t==='move'?(K(...x.m)===K(...fromPos(i))?'zostaje':'ruch → '+x.m.join(', ')):'atak '+DN[x.d])}).join(' · ');
    h+='<div class="card" style="font-size:14px">'+sumTxt+'<br><b>'+waitTxt()+'</b></div><div class="row" style="flex-wrap:nowrap"><button style="flex:1" data-a="edit">Zmień plan</button>'+(H?'<button class="go" style="flex:2" data-a="hnext">Ukryj plan i przekaż telefon</button>':'')+'</div>';
  }
 }
 const isGame=st.scr!=='lobby';
  if(isGame){if(!BOARD_SVG)board({});}
  app.className=isGame?'':'full';
  app.innerHTML=h;stageSet(isGame);
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-ch],[data-t],[data-a],[data-k],[data-hp],[data-n]');if(!t)return;
 const ds=t.dataset,pl=st.plan[st.ph];
 if(st.animating&&ds.a!=='skip')return;
 if(ds.k&&(st.scr==='rev'||st.scr==='hrev')){pushPick(ds.k);render();return}
 if(ds.a==='start'){st.scr='lobby'}
 else if(ds.ch){st.ch=ds.ch;st.start=null}
 else if(ds.t){pl.t=ds.t;pl.m=null;pl.d=null}
 else if(ds.n){H={n:+ds.n,cur:0,tgt:'pick',p:Array.from({length:+ds.n},()=>({ch:null,start:null,plans:{},posr:{},hp:5,hpr:{1:5},hpo:{}}))};st.round=1;st.scr='hpass'}
 else if(ds.a==='hot'){net.db=null;H=null;st.scr='hsetup'}
 else if(ds.a==='hgo'){if(H.tgt==='pick'){st.scr='pick';st.start=null;st.ch=Object.keys(C).find(n=>!taken(n))}else{const p=H.p[H.cur];st.scr='plan';st.ch=p.ch;st.start=p.posr[st.round];st.plan=[{t:null,m:null,d:null},{t:null,m:null,d:null}];st.ph=0;st.done=false}}
 else if(ds.a==='hplan'){H.cur=0;H.tgt='plan';st.scr='hpass'}
 else if(ds.a==='hnext'){const p=H.p[H.cur];p.plans[st.round]=JSON.parse(JSON.stringify(st.plan));const nx=H.p.findIndex((q,i)=>i>H.cur&&alive(q,st.round));if(nx>=0){H.cur=nx;H.tgt='plan';st.scr='hpass'}else st.scr='hrev'}
 else if(ds.a==='hnextr'){{const Q=resolve(H.p.map((q,i)=>({id:'p'+i,q,idx:i})));H.p.forEach((p,i)=>{const x=Q['p'+i];p.posr[st.round+1]=x?x.pos:p.posr[st.round];p.hpr[st.round+1]=x?x.eff:0})}st.round++;H.cur=H.p.findIndex(p=>alive(p,st.round));H.tgt='plan';st.scr='hpass'}
 else if(ds.a==='confirm'&&H){const p=H.p[H.cur];p.ch=st.ch;p.start=st.start;p.posr[1]=st.start;if(H.cur<H.n-1){H.cur++;H.tgt='pick';st.scr='hpass'}else st.scr='hstarts'}
 else if(ds.a==='confirm'&&net.db){ME.ch=st.ch;ME.start=st.start;ME.sready=true;ME.posr[1]=st.start;save();st.scr='wait'}
 else if(ds.a==='confirm'){st.scr='plan';st.plan=[{t:null,m:null,d:null},{t:null,m:null,d:null}];st.ph=0;st.done=false}
 else if(ds.a==='back'){st.scr='pick'}
 else if(ds.a==='ok'){if(st.leaving)return;st.leaving=true;const pe=document.getElementById('phpanel');if(pe)pe.classList.add('pout');setTimeout(()=>{st.leaving=false;if(st.ph===0)st.ph=1;else{st.done=true;if(net.db){ME.plans[st.round]=JSON.parse(JSON.stringify(st.plan));save();chk()}}render()},pe?380:0);return}
 else if(ds.a==='prev'){st.ph=0}
 else if(ds.a==='create'){join(Math.random().toString(36).slice(2,6))}
 else if(ds.a==='joinb'){const v=(document.getElementById('code').value||'').trim();if(v.length===4)join(v)}
 else if(ds.a==='solo'){net.db=null;st.scr='pick'}
 else if(ds.a==='goplan'){st.scr='plan';st.start=ME.start;st.plan=[{t:null,m:null,d:null},{t:null,m:null,d:null}];st.ph=0;st.done=false}
 else if(ds.a==='next'){{const x=resolve(netItems())[net.uid];if(x){ME.posr[st.round+1]=x.pos;ME.hpr[st.round+1]=x.eff}}st.round++;st.start=ME.posr[st.round];st.plan=[{t:null,m:null,d:null},{t:null,m:null,d:null}];st.ph=0;st.done=false;st.scr='plan';save()}
 else if(ds.hp!==undefined){const q=H?H.p[+ds.pi]:ME;q.hpo=q.hpo||{};q.hpo[st.round]=+ds.eff===+ds.hp?+ds.hp-1:+ds.hp;if(!H)save()}
 else if(ds.a==='edit'){st.done=false;st.ph=0;if(net.db){delete ME.plans[st.round];save()}}
 else if(ds.k){
  const [q,r]=ds.k.split(',').map(Number);
  if(st.scr==='pick')st.start=[q,r];
  else if(!st.done){
   const from=fromPos(st.ph),i=D.findIndex(([a,b])=>from[0]+a===q&&from[1]+b===r);
   if(pl.t==='move'&&(i>=0||(q===from[0]&&r===from[1])))pl.m=[q,r];
   else if(pl.t==='atk'&&i>=0)pl.d=i;
  }
 }
 render();
});
render();
window.addEventListener('resize',()=>render());
initNet();
</script>
